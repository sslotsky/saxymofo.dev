name: Review App
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
jobs:
  review-app:
    name: Deploy review app
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency: review-app-${{ github.event.number }}
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: deploy
        uses: superfly/fly-pr-review-apps@5d9f067254bebd0aaa77d908d6337b63f4d4f019 # 1.6.0
        with:
          name: saxymofo-dot-dev-pr-${{ github.event.number }}
          region: ord
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_REVIEW_APPS_TOKEN }}
